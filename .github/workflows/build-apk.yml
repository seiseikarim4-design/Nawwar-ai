
name: Build Nawwar AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o NawwarAI-Android-Project.zip -d source
            - name: Fix Java version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/build.gradle.kts")
          s = p.read_text()
          fix = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """
          if "sourceCompatibility" not in s:
              s = s.replace("android {", "android {\n" + fix, 1)
              p.write_text(s)
          PY
      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NawwarAI-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
